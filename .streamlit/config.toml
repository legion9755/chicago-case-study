[browser]
gatherUsageStats = false

# Theme: dense dual-mode dashboard (light/dark toggle stays in the settings menu),
# retinted to the project's navy brand colour.
[theme]
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "8px"
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 14
baseFontWeight = 400
codeFontSize = "13px"
headingFontSizes = ["28px", "20px", "17px", "15px", "14px", "12px"]
headingFontWeights = [700, 600, 600, 600, 500, 500]
metricValueFontWeight = 600
linkUnderline = false
paddingTop = "1rem"
paddingBottom = "3rem"

[theme.light]
primaryColor = "#1F4E79"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6F9"
codeBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
linkColor = "#1F4E79"
borderColor = "#D9DEE5"
codeTextColor = "#334155"
greenColor = "#15803D"
redColor = "#C2261C"
yellowColor = "#B45309"
orangeColor = "#C2410C"
blueColor = "#1F4E79"
violetColor = "#6D28D9"
grayColor = "#64748B"
chartCategoricalColors = [
    "#1F4E79",
    "#2E86C1",
    "#15803D",
    "#C2410C",
    "#6D28D9",
    "#C2261C",
    "#64748B",
    "#B45309",
]
chartSequentialColors = [
    "#F0F6FB",
    "#DCEAF6",
    "#BCD6EE",
    "#93BDE2",
    "#66A1D3",
    "#4285C2",
    "#2E6BA8",
    "#1F4E79",
    "#173B5C",
    "#0F2840",
]
dataframeBorderColor = "#D9DEE5"
dataframeHeaderBackgroundColor = "#F4F6F9"
dataframeHeaderTextColor = "#0F172A"

[theme.dark]
primaryColor = "#5B9BD5"
